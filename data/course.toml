# ─────────────────────────────────────────────────────────────────────
# Элементы контроля. Десять штук.
#
# code            — латиницей, им пользуется CLI: --assessment hw1
# label           — как элемент называется для студента: ДЗ-1
# component       — ключ из [components]
# weight_final    — вес в ИТОГОВОЙ оценке. Внутрикомпонентный вес выводится
#                   делением на вес компонента, руками его не дублируем.
# submit_via_bot  — принимает ли бот сдачу; у проверочных работ false
# deadline        — момент, после которого сдача считается просроченной
# accept_until    — момент, после которого бот вообще перестаёт принимать
# graded_on       — дата, с которой элемент считается «пройденным» для расчёта
#                   «сейчас» у работ, которые не сдаются через бота
#
# Проверка сумм: homework 4×0,0625 = 0,25 · quizzes 4×0,025 + 0,05 = 0,15
#                project1 0,20 · exam 0,30 · attendance 0,10 → всего 1,00
# ─────────────────────────────────────────────────────────────────────

# ── Домашние задания ──────────────────────────────────────────────────
#
# Решение от 05.09.2026: дедлайн ЕДИНЫЙ для обеих групп, выдача в субботу —
# в день семинара группы 261, когда обе группы уже прошли тему (262 — в среду).
# Так задание не утекает от 262 к 261. Прежнее правило «семинар своей группы
# + 7 дней» с раздельными датами отменено.

[[assessments]]
code = "hw1"
label = "ДЗ-1"
component = "homework"
weight_final = 0.0625
title = "Окружение, репозиторий и Python-идиомы"
summary = """
Настроить окружение через uv, завести личный репозиторий проекта по шаблону, \
подключиться к учебной БД, выгрузить свою таблицу, решить 8 задач на коллекции \
и функции. Сдать ссылкой на репозиторий с оформленным pull request."""
submit_via_bot = true
issued_at = 2026-09-12T12:30:00+03:00
deadline = 2026-09-19T23:59:00+03:00
accept_until = 2026-09-26T23:59:00+03:00
late_rule = "homework"

[[assessments]]
code = "hw2"
label = "ДЗ-2"
component = "homework"
weight_final = 0.0625
title = "Витрина клиента: соединения и агрегаты"
summary = """
Собрать витрину клиента на своём сегменте, доказать отсутствие двойного счёта, \
посчитать 5 заданных агрегатов, ответить на 3 бизнес-вопроса."""
submit_via_bot = true
issued_at = 2026-09-26T12:30:00+03:00
deadline = 2026-10-03T23:59:00+03:00
accept_until = 2026-10-10T23:59:00+03:00
late_rule = "homework"

[[assessments]]
code = "hw3"
label = "ДЗ-3"
component = "homework"
weight_final = 0.0625
title = "Дизайн и анализ своего пилота"
