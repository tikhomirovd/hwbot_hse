# Конструкция курса «Программирование на Python для бизнес-аналитики».
#
# Это источник правды для бота: календарь занятий и все элементы контроля.
# Файл читается стандартной библиотекой (tomllib), новых зависимостей не нужно.
#
# Правило: даты и веса меняются ТОЛЬКО здесь. В коде их быть не должно.
# После правки — `uv run hwbot seed-course`, изменения применяются идемпотентно.
#
# Учебный год 2026/2027, модули 1–2. Все времена — Europe/Moscow.

[course]
code = "python-ba-2026"
title = "Программирование на Python для бизнес-аналитики"
programme = "Бизнес-аналитика и цифровые решения в финансах (БАЦРФ)"
year = "2026/2027"
timezone = "Europe/Moscow"

# Занятий на одного студента: 12 лекций + 12 семинаров своей группы.
# Это знаменатель посещаемости. В таблице lessons строк больше (36),
# потому что семинар каждой темы проходит дважды — для группы 261 и для группы 262.
lessons_per_student = 24

# Накопленная оценка не может превысить 7 баллов: сумма весов её компонентов 0,70.
accumulated_cap = 7.0

# Экзамен — блокирующий элемент. Ниже этого балла итоговая не поднимается выше final_cap_when_blocked.
exam_blocking_threshold = 4.0
final_cap_when_blocked = 3.0

# Все оценки по 10-балльной шкале.
score_min = 0.0
score_max = 10.0


# ─────────────────────────────────────────────────────────────────────
# Компоненты оценки. Веса взяты из ПУД дословно.
#
#   Онакопленная = 0,10·Посещаемость + 0,15·Проверочные + 0,25·ДЗ + 0,20·Проект 1
#   Оитоговая    = Онакопленная + 0,30·Экзамен
#
# Сумма весов всех пяти компонентов = 1,00. Сумма четырёх первых = 0,70.
# ─────────────────────────────────────────────────────────────────────

[components.attendance]
weight = 0.10
title = "Посещаемость"
in_accumulated = true
# Оценка считается не из элементов контроля, а из таблицы attendance по шкале ниже.
computed_from = "attendance"

[components.quizzes]
weight = 0.15
title = "Проверочные работы"
in_accumulated = true
computed_from = "assessments"

[components.homework]
weight = 0.25
title = "Домашние задания"
in_accumulated = true
computed_from = "assessments"

[components.project1]
weight = 0.20
title = "Проект 1"
in_accumulated = true
computed_from = "assessments"

[components.exam]
weight = 0.30
title = "Экзамен"
in_accumulated = false
computed_from = "assessments"
blocking = true


# ─────────────────────────────────────────────────────────────────────
# Шкала посещаемости — одиннадцатиступенчатая, действует с 04.09.2026.
#
# В steps десять строк, баллы 10..1. Одиннадцатый уровень — ноль — задан не строкой,
# а флагом zero_if_nothing_attended: он зависит не от процента, а от факта
# «не был ни разу». Нижняя ступень «70 % и менее» даёт 1 балл и распространяется
# даже на одно посещённое занятие из 24, поэтому проверка на ноль идёт ПЕРВОЙ.
#
# Ступень выбирается по проценту посещённых занятий, округлённому арифметически
# до целого (ROUND_HALF_UP, не банковское округление). Границы включительные.
# ─────────────────────────────────────────────────────────────────────

[attendance_scale]
zero_if_nothing_attended = true
# Опоздание более чем на 20 минут или уход до конца занятия = отсутствие.
late_arrival_minutes_counts_as_absent = 20

# min_percent = нижняя граница ступени включительно; верхняя — на 1 меньше
# нижней границы следующей ступени. Список отсортирован по убыванию.
steps = [
    { min_percent = 97, score = 10 },
    { min_percent = 94, score = 9 },
    { min_percent = 91, score = 8 },
    { min_percent = 87, score = 7 },
    { min_percent = 84, score = 6 },
    { min_percent = 81, score = 5 },
    { min_percent = 77, score = 4 },
    { min_percent = 74, score = 3 },
    { min_percent = 71, score = 2 },
    { min_percent = 0, score = 1 },
]


# ─────────────────────────────────────────────────────────────────────
# Правила просрочки. Ссылаются по имени из поля late_rule элемента.
#
# days_late = число НАЧАТЫХ суток после дедлайна, то есть
#             ceil((submitted_at - deadline) / 86400); минимум 1, если опоздал вообще.
#
# Правило даёт ПОТОЛОК балла, а не сам балл: преподаватель ставит оценку
# как обычно, бот ограничивает её сверху. Балл 7 при потолке 4 станет 4.
# ─────────────────────────────────────────────────────────────────────

# ДЗ: «За каждые начатые сутки просрочки снимается 1 балл из 10,
# но не ниже 4 баллов при сдаче в течение недели после дедлайна; позже — 0 баллов.»
[late_rules.homework]
per_day = 1.0
floor = 4.0
floor_within_days = 7
zero_after_days = 7

# Проект 1: с 05.09.2026 правило приведено к тому же, что у ДЗ — раньше в ПУД было
# только «понижение на 1 балл за каждые начатые сутки», без нижней границы и без
# закрытия приёма. Теперь: не ниже 4 баллов в течение недели (до 01.11), позже — 0.
# Дополнительно, чего бот не считает: после 01.11 защита не назначается, а слот
# защиты выбирается студентом после сдачи работы, в пределах 26.10–06.11.
[late_rules.project1]
per_day = 1.0
floor = 4.0
floor_within_days = 7
zero_after_days = 7

# Экзамен: штраф за просрочку в ПУД не описан вовсе. Не выдумывать.
[late_rules.none]
per_day = 0.0
floor = 0.0
zero_after_days = 0


