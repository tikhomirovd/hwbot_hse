[project]
name = "hwbot"
version = "0.1.0"
description = "Telegram-бот сбора ДЗ для 1 курса БАЦРФ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.31.0",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
hwbot = "hwbot.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["hwbot"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
